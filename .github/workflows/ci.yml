name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # After you commit package-lock.json, switch this to `npm ci` and add `cache: npm` above.
      - run: npm install
      - run: npm run test:ci
      - run: npm run build:lib
      - run: npm run build:demo
      - name: Check the package contents
        run: npm run pack:check
